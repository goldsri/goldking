
name: Goldking Plus Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requests
        run: pip install requests

      - name: Update Playlist
        env:
          SOURCE_M3U_URL_2: ${{ secrets.SOURCE_M3U_URL_2 }}
        run: python goldkingplus.py

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add goldkingplus.m3u
          git diff --cached --quiet || git commit -m "Update Goldking Plus"
          git push
