name: Premium IPTV M3U Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours (UTC)

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Download and validate M3U
        env:
          SOURCE_M3U_URL_2: ${{ secrets.SOURCE_M3U_URL_2 }}
        run: python premiumiptv23.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premiumiptv23.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Auto-update premiumiptv23 playlist"
            git push
          fi
